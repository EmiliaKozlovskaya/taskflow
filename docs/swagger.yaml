  internal_features_users_transport_http.CreateUserRequest:
    properties:
      full_name:
        description: id не нужен(сами нагенерим), version не нужен(по умолчанию 1)
        example: Ivan Ivanov
        maxLength: 100
        minLength: 3
        type: string
      phone_number:
        description: examples оставляем для красивой документации в swagger
        example: "+7999887766"
        maxLength: 15
        minLength: 10
        type: string
