host: 127.0.0.1:5050
info:
  contact: {}
  description: Todo Application REST-API scheme
  title: Golang Todo API
  version: "1.0"
paths:
  /statistics:
    get:
      description: Получение статистики по задачам с опциональной фильтрацией по user_id
        и/или временному промежутку
      parameters:
      - description: Фильтрация статистики по конкретному пользователю
        in: query
        name: user_id
        type: integer
      - description: 'Начало промежутка рассмотрения статистики(включительно), формат:
          YYYY-MM-DD'
        in: query
        name: from
        type: string
      - description: 'Конец промежутка рассмотрения статистики(не включительно), формат:
          YYYY-MM-DD'
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Пользователи успешно получены
          schema:
            $ref: '#/definitions/internal_features_statistics_transport_http.GetStatisticsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_EmiliaKozlovskaya_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server error
          schema:
            $ref: '#/definitions/github_com_EmiliaKozlovskaya_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
      summary: Получение статистики
      tags:
      - statistics
  /tasks:
    get:
      description: Получение всех существующих задач в системе c опциональной пагинацией
        и/или фильтрацией по ID автора задачи
      parameters:
      - description: ID автора задачи
        in: path
        name: user_id
        required: true
        type: integer
      - description: Размер страницы с задачами
        in: query
        name: limit
        type: integer
      - description: Смещение страницы с задачами
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Задачи успешно получены
          schema:
            items:
              $ref: '#/definitions/internal_features_tasks_transport_http.TaskDTOResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_EmiliaKozlovskaya_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server error
          schema:
            $ref: '#/definitions/github_com_EmiliaKozlovskaya_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
      summary: Получение всех задач
      tags:
      - tasks
    post:
      consumes:
      - application/json
      description: Метод для обработки http запроса на создание новой задачи в системе.
      parameters:
      - description: CreateTask тело запроса (обязательный формат входящей ДТО)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_tasks_transport_http.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Успешно созданная задача возвращается в данном ответном ДТО
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.CreateTaskResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_EmiliaKozlovskaya_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Author not found
          schema:
            $ref: '#/definitions/github_com_EmiliaKozlovskaya_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_EmiliaKozlovskaya_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
      summary: Создать задачу
      tags:
      - tasks
  /tasks/{id}:
    delete:
      description: Удаление существующей в системе задачи по её ID
      parameters:
      - description: ID удаляемой задачи
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Успешное удаление задачи
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_EmiliaKozlovskaya_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/github_com_EmiliaKozlovskaya_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server Error
          schema:
            $ref: '#/definitions/github_com_EmiliaKozlovskaya_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
      summary: Удаление задачи
      tags:
      - tasks
    get:
      description: Получение существующей задачи из базы по её ID
      parameters:
      - description: ID получаемой задачи
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Задача успешно найдена
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.GetTaskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_EmiliaKozlovskaya_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Task Not Found
          schema:
            $ref: '#/definitions/github_com_EmiliaKozlovskaya_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server error
          schema:
            $ref: '#/definitions/github_com_EmiliaKozlovskaya_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
      summary: Получение задачи
      tags:
      - tasks
    patch:
      consumes:
      - application/json
      description: |-
        Изменение информации об уже существующей в системе задачи
        ### Логика обновления полей (Three-state logic):
        1. **Поле не передано**: `description` игнорируется, значение в БД не меняется
        2. **Явно передано значение**: `"description":"Сделать до четверга"` - устанавливает новое описание в БД
        3. **Явно передано значение null**: `"description": null` - очищает поле в БД (set to NULL)
        Ограничения: `title` и `completed` не может быть выставлен как null
      parameters:
      - description: ID изменяемой задачи
        in: path
        name: id
        required: true
        type: integer
      - description: PatchTask тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_tasks_transport_http.PatchTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Задача успешно изменена
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.PatchTaskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_EmiliaKozlovskaya_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Task Not Found
          schema:
            $ref: '#/definitions/github_com_EmiliaKozlovskaya_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_EmiliaKozlovskaya_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server error
          schema:
            $ref: '#/definitions/github_com_EmiliaKozlovskaya_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
      summary: Изменение задачи
      tags:
      - tasks
  /users:
    get:
      description: Получение всех существующих пользователей в системе c опциональной
        пагинацией
      parameters:
      - description: Размер страницы с пользователями
        in: query
        name: limit
        type: integer
      - description: Смещение страницы с пользователями
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Пользователи успешно получены
          schema:
            items:
              $ref: '#/definitions/internal_features_users_transport_http.UserDTOResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_EmiliaKozlovskaya_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server error
          schema:
            $ref: '#/definitions/github_com_EmiliaKozlovskaya_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
      summary: Получение всех пользователей
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Метод для обработки http запроса на создание нового пользователя
        в системе.
      parameters:
      - description: CreateUser тело запроса (обязательный формат входящей ДТО)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_users_transport_http.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Успешно созданный пользователь возвращается в данном ответном
            ДТО
          schema:
            $ref: '#/definitions/internal_features_users_transport_http.CreateUserResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_EmiliaKozlovskaya_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_EmiliaKozlovskaya_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
      summary: Создать пользователя
      tags:
      - users
  /users/{id}:
    delete:
      description: Удаление существующего в системе пользователя по его ID
      parameters:
      - description: ID удаляемого пользователя
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Успешное удаление пользователя
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_EmiliaKozlovskaya_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/github_com_EmiliaKozlovskaya_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server Error
          schema:
            $ref: '#/definitions/github_com_EmiliaKozlovskaya_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
      summary: Удаление пользователя
      tags:
      - users
    get:
      description: Получение существующего пользователя из базы по его ID
      parameters:
      - description: ID получаемого пользователя
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Пользователь успешно найден
          schema:
            $ref: '#/definitions/internal_features_users_transport_http.GetUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_EmiliaKozlovskaya_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: User Not Found
          schema:
            $ref: '#/definitions/github_com_EmiliaKozlovskaya_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server error
          schema:
            $ref: '#/definitions/github_com_EmiliaKozlovskaya_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
      summary: Получение пользователя
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: |-
        Изменение информации об уже существующем в системе пользователе
        ### Логика обновления полей (Three-state logic):
        1. **Поле не передано**: `phone_number` игнорируется, значение в БД не меняется
        2. **Явно передано значение**: `"phone_number":"+71112223344"` - устанавливает новый номер телефона в БД
        3. **Явно передано значение null**: `"phone_number": null` - очищает поле в БД (set to NULL)
        Ограничения: `full_name` не может быть выставлен как null
      parameters:
      - description: ID изменяемого пользователя
        in: path
        name: id
        required: true
        type: integer
      - description: PatchUser тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_users_transport_http.PatchUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Пользователь успешно изменен
          schema:
            $ref: '#/definitions/internal_features_users_transport_http.PatchUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_EmiliaKozlovskaya_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: User Not Found
          schema:
            $ref: '#/definitions/github_com_EmiliaKozlovskaya_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_EmiliaKozlovskaya_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server error
          schema:
            $ref: '#/definitions/github_com_EmiliaKozlovskaya_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
      summary: Изменение пользователя
      tags:
      - users
swagger: "2.0"
