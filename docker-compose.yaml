#нужный image можно найти на hub.docker.com
services:
  todoapp:
    build:
      context: ${PROJECT_ROOT} #для понимания относительно чего брать go.mod, go.sum
      dockerfile: ${PROJECT_ROOT}/cmd/todoapp/Dockerfile
    container_name: todoapp
    environment:
      # из .env
      - HTTP_ADDR=:5050
      - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - TIME_ZONE=${TIME_ZONE}
      # и в самом запуске make todoapp-run мы вводили еще две локальные переменные окружения
      - POSTGRES_HOST=todoapp-postgres #роутинг в сети идет по названиям docker compose сервисов, а эти все сервисы в одной докер сети
      - LOGGER_FOLDER=/app/out/logs
    volumes:
      - ${PROJECT_ROOT}/out/logs:/app/out/logs
    ports:
      - "5050:5050"
    restart: always

  todoapp-postgres:
    image: postgres:18.1-bookworm
    container_name: todoapp-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      #Создание папки на локальной машине для сохранения данных PostgreSQL (чтобы данные сохранялись даже после остановки контейнера)
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql # Директория на лок машине : Директория внутри контейнера
      # docker volume сам создаст папку pgdata внутри папки out, если её нет
    restart: always # Автоматический перезапуск контейнера при сбое или перезагрузке системы

  todoapp-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations # Монтируем папку с миграциями внутрь контейнера

  #port-forwarder нужен для того, чтобы иметь возможность подключаться к базе данных PostgreSQL с лок машины (вместо проброса портов)
  #Обеспечивает двунаправленную связь между локальной машиной и контейнером PostgreSQL, позволяя подключаться к базе данных так, как если бы она работала на локальной машине.
  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: todoapp-postgress-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:todoapp-postgres:5432
    ports:
      - "127.0.0.1:5432:5432" # Проброс порта 5432, localhost:5432 чтобы не было доступа извне

  swagger:
    build:
      context: ${PROJECT_ROOT}
      # чтобы не создавать отдельный dockerfile мы его описываем в самом docker сервисе
      # так каак go install нуждается в команде git чтобы скачивать зависимости то так же скачиваем туда git (т.к в image alpine почти ничего кроме компилятора go нет)
      dockerfile_inline: |
        FROM golang:1.25.0-alpine
        RUN apk add --no-cache git 
        RUN go install github.com/swaggo/swag/cmd/swag@v1.16.6
        WORKDIR /code
        ENTRYPOINT ["swag"]
    volumes:
      - ${PROJECT_ROOT}:/code
