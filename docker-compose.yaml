#нужный image можно найти на hub.docker.com
services:
  todoapp:
    build:
      context: ${PROJECT_ROOT} #для понимания относительно чего брать go.mod, go.sum
      dockerfile: ${PROJECT_ROOT}/cmd/todoapp/Dockerfile
    container_name: todoapp
    environment:
      # из .env
      # внутри контейнера мы можем использовать переменные окружения, которые мы передали в docker-compose.yaml
      # докер контейнер не имеет доступа к переменным окружения локальной машины, поэтому мы должны явно передавать их в контейнер через docker-compose.yaml
      - HTTP_ADDR=:5050
      - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - TIME_ZONE=${TIME_ZONE}
      # и в самом запуске make todoapp-run мы вводили еще две локальные переменные окружения
      - POSTGRES_HOST=todoapp-postgres #роутинг в сети идет по названиям docker compose сервисов, а эти все сервисы в одной докер сети
      - LOGGER_FOLDER=/app/out/logs
      - REDIS_HOST=todoapp-redis
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_USERNAME=${REDIS_USERNAME}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB}
      - REDIS_TIMEOUT=${REDIS_TIMEOUT}
      # Kafka
      - KAFKA_ENABLED=${KAFKA_ENABLED:-false}
      - KAFKA_BROKERS=kafka:9092 #роутинг в сети идет по названиям docker compose сервисов, а эти все сервисы в одной докер сети
      - KAFKA_TOPIC=${KAFKA_TOPIC:-todo.task-events}
      - KAFKA_GROUP_ID=todo-kafka-worker
    volumes:
      - ${PROJECT_ROOT}/out/logs:/app/out/logs
    ports:
      - "5050:5050"
    depends_on:
      todoapp-redis:
        condition: service_healthy
    restart: always

  todoapp-postgres:
    image: postgres:18.1-bookworm
    container_name: todoapp-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      #Создание папки на локальной машине для сохранения данных PostgreSQL (чтобы данные сохранялись даже после остановки контейнера)
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql # Директория на лок машине : Директория внутри контейнера
      # docker volume сам создаст папку pgdata внутри папки out, если её нет
    restart: always # Автоматический перезапуск контейнера при сбое или перезагрузке системы

  todoapp-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations # Монтируем папку с миграциями внутрь контейнера

  #port-forwarder нужен для того, чтобы иметь возможность подключаться к базе данных PostgreSQL с лок машины (вместо проброса портов)
  #Обеспечивает двунаправленную связь между локальной машиной и контейнером PostgreSQL, позволяя подключаться к базе данных так, как если бы она работала на локальной машине.
  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: todoapp-postgress-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:todoapp-postgres:5432
    ports:
      - "127.0.0.1:5432:5432" # Проброс порта 5432, localhost:5432 чтобы не было доступа извне

  swagger:
    build:
      context: ${PROJECT_ROOT}
      # чтобы не создавать отдельный dockerfile мы его описываем в самом docker сервисе
      # так каак go install нуждается в команде git чтобы скачивать зависимости то так же скачиваем туда git (т.к в image alpine почти ничего кроме компилятора go нет)
      dockerfile_inline: |
        FROM golang:1.25.0-alpine
        RUN apk add --no-cache git 
        RUN go install github.com/swaggo/swag/cmd/swag@v1.16.6
        WORKDIR /code
        ENTRYPOINT ["swag"]
    volumes:
      - ${PROJECT_ROOT}:/code

  todoapp-redis:
    image: redis:8-alpine
    container_name: todoapp-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.2
    container_name: todoapp-kafka
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@todoapp-kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CLUSTER_ID: "abcdefghijklmnopqrstuv"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always

  kafka-worker:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/cmd/kafka-worker/Dockerfile
    environment:
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=${KAFKA_TOPIC:-todo.task-events}
      - KAFKA_GROUP_ID=todo-kafka-worker
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - LOGGER_FOLDER=/app/out/logs/kafka-worker
    volumes:
      - ${PROJECT_ROOT}/out/logs:/app/out/logs
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
